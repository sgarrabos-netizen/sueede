<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Producto · Sueede</title>

  <meta
    name="description"
    content="Producto Sueede"
  >

  <!-- TIPOGRAFÍA -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->

  <link
    rel="stylesheet"
    href="./css/styles.css"
  >

</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header class="header">


    <nav
      class="nav"
      aria-label="Navegación principal"
    >

      <a href="./index.html#tops">
        Tops
      </a>

      <a href="./index.html#shorts">
        Shorts & Minis
      </a>

      <a href="./index.html#conjuntos">
        Conjuntos
      </a>

      <a href="./index.html#accesorios">
        Accesorios
      </a>

    </nav>


    <a
      href="./index.html"
      class="logo"
    >
      sueede
    </a>


    <div class="header__right">

      <a
        href="./login.html"
        class="acceso"
      >
        Ingresar
      </a>

    </div>

  </header>



  <!-- =========================
       PRODUCTO
  ========================== -->

  <main>


    <section class="detalle-producto">


      <!-- GALERÍA -->

      <div
        class="detalle-galeria"
        id="galeriaProducto"
      >

        <!--
        JavaScript va a poner acá las fotos
        -->

      </div>



      <!-- INFORMACIÓN -->

      <div class="detalle-info">


        <p
          class="detalle-categoria"
          id="categoriaProducto"
        >
        </p>


        <h1 id="nombreProducto">
        </h1>


        <p
          class="detalle-precio"
          id="precioProducto"
        >
        </p>


        <p
          class="detalle-descripcion"
          id="descripcionProducto"
        >
        </p>


       <div class="selector-color">

  <p>
    <strong>Elegí un color:</strong>
  </p>

  <div
    class="opciones-color"
    id="coloresProducto"
  >
  </div>

</div>


<button
  class="boton-whatsapp"
  id="botonAgregarCarrito"
  type="button"
>
  Agregar al carrito
</button>

      </div>


    </section>



    <!-- =========================
         PRODUCTOS RELACIONADOS
    ========================== -->

    <section class="relacionados">


      <h2>
        También te puede gustar
      </h2>


      <div
        class="productos-grid"
        id="productosRelacionados"
      >

        <!--
        JavaScript coloca acá
        productos de la misma categoría
        -->

      </div>


    </section>


  </main>



  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">


    <a
      href="./index.html"
      class="logo"
    >
      sueede
    </a>


    <div class="footer__links">

      <a href="./index.html#tops">
        Tops
      </a>

      <a href="./index.html#shorts">
        Shorts & Minis
      </a>

      <a href="./index.html#conjuntos">
        Conjuntos
      </a>

      <a href="./index.html#accesorios">
        Accesorios
      </a>

    </div>


    <div class="footer__links">

      <a href="#">
        Instagram
      </a>

      <a href="#">
        WhatsApp
      </a>

    </div>


  </footer>



  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <!--
  IMPORTANTE:
  productos.js tiene que ir PRIMERO
  porque producto.js usa esos datos.
  -->

  <script src="./js/productos.js"></script>

  <script src="./js/producto.js"></script>


</body>

</html>
